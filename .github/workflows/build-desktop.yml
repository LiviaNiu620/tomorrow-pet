name: Build desktop apps
on:
  push:
    branches: [main, redesign-dango, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      DANGO_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Core tests on runner architecture
        run: DANGO_ARCH="$(uname -m)" ./script/build_and_run.sh --test
      - name: Package application
        run: ./script/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TomorrowPet-macOS-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
