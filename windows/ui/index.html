<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>明日团子</title><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#content">跳到主内容</a><aside class="sidebar"><div class="brand"><div class="mascot" aria-hidden="true"><i></i><i>•ᴗ•</i><i></i></div><div><strong>明日团子</strong><p>一天一串，慢慢吃完</p></div></div><nav id="nav" aria-label="主导航"></nav><div class="sidebar-caption">领域</div><div id="areas"></div><div class="pet-note"><small>团子说</small><p id="pet-note">先做一件小事，就很好。</p></div><button class="settings-nav" data-route="settings">⚙ 设置 <kbd>Ctrl ,</kbd></button><button class="command-nav" id="command-open">命令面板 <kbd>Ctrl K</kbd></button></aside><main id="content" tabindex="-1"><div id="view"></div></main><div id="toast" role="status" aria-live="polite" hidden></div><dialog id="task-dialog"><form id="task-form"><div class="dialog-head"><h2>任务详情</h2><button type="button" data-close="task-dialog" aria-label="关闭">×</button></div><input type="hidden" name="id"><label>标题<input name="title" required maxlength="1000"></label><div class="form-grid"><label>状态<select name="status"><option value="inbox">收件箱</option><option value="next">下一步</option><option value="planned">已计划</option><option value="inProgress">进行中</option><option value="waiting">等待中</option><option value="completed">已完成</option></select></label><label>领域<select name="areaID" id="task-area"></select></label><label>计划日期<input type="date" name="plannedDate"></label><label>开始时间<input type="time" name="time"></label><label>截止日期<input type="date" name="dueDate"></label><label>估时（分钟）<input type="number" name="estimatedMinutes" min="5" max="480" step="5"></label><label>优先级<select name="priority"><option value="none">无</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label><label>本周目标<select name="weeklyGoalIndex"><option value="">不关联</option><option value="0">目标 1</option><option value="1">目标 2</option><option value="2">目标 3</option></select></label></div><label class="check-label"><input type="checkbox" name="focus">设为所选日期的重点</label><label>项目<input name="project"></label><label>标签（逗号分隔）<input name="tags"></label><label>备注<textarea name="notes" rows="3"></textarea></label><div class="form-grid"><label>重复<select name="repeat"><option value="">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option></select></label><label>每隔几个周期<input name="interval" type="number" min="1" max="99" value="1"></label></div><p class="muted">每周重复沿用任务原有星期设置；完成后会创建下一实例。</p><footer><button type="button" class="danger" id="delete-task">移到垃圾箱</button><button class="primary" type="submit">保存更改</button></footer><p class="error" id="task-error" role="alert"></p></form></dialog><dialog id="command-dialog"><div class="dialog-head"><h2>你想去哪里？</h2><button data-close="command-dialog" aria-label="关闭">×</button></div><input id="command-search" placeholder="搜索页面或任务" aria-label="搜索命令"><div id="command-results"></div></dialog><script src="app.js"></script></body></html>
